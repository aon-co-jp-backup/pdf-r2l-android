[package]
name = "pdf-r2l-android"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "PDF R2L Android (Rust core via JNI)"

[lib]
name = "pdfr2l_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = "0.34"
jni = "0.21"

[profile.release]
opt-level = "s"
lto = true
strip = true
